# yaml-language-server: $schema=https://raw.githubusercontent.com/kuroctl/kuro/main/shared/prefab/schema/prefab.v1.schema.json
# Counter-Strike 2 (Valve) : serveur dédié Linux, même application Steam que le jeu (730),
# installé par SteamCMD en anonyme. Image d'exécution : `runtime-steamcmd` de Kuro (Debian 13,
# utilisateur 1000, tini ; ADR-0048), comme Rust. Sans jeton de serveur (GSLT), le serveur reste
# en réseau local et n'apparaît pas dans la liste de Steam.
schema: kuro.prefab/v1
id: counter-strike-2
version: 1.1.0
category: game
tags: [counter-strike, cs2, fps, steam]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
  resources:
    memory_mb: { min: 2048, recommended: 4096 }
    cpu_percent: { min: 100, recommended: 200 }
    # Jeu complet (~40 Go), cartes et mises à jour comprises.
    disk_mb: { min: 40960, recommended: 61440 }
assets:
  icon: assets/icon.jpg
  cover: assets/banner.jpg
  thumbnail: assets/thumbnail.jpg
x-status: "draft: not yet tried on a real node (players joining, LAN-only behaviour without GSLT)"
# Jeu sur le magasin Steam : le Studio en importe les images (ADR-0039).
steam: { app: 730 }

services:
  server:
    image: ghcr.io/kuroctl/runtime-steamcmd@sha256:5cf1e3a9fa0eeb1579b0a2c1aad0f6dfd28d91291f98e0729c31e600fbe0fe0f
    # Le shell ne fait que se placer dans le dossier du binaire ; les valeurs restent des arguments
    # séparés ("$@"), jamais collés dans le script.
    command:
      - sh
      - -c
      - 'cd /data/server/game/bin/linuxsteamrt64 && exec ./cs2 "$@"'
      - cs2
      - -dedicated
      - -console
      - +ip
      - 0.0.0.0
      - -port
      - "{{ ports.game.container }}"
      - -maxplayers
      - "{{ settings.max_players }}"
      - +game_alias
      - "{{ settings.game_alias }}"
      - +map
      - "{{ settings.map }}"
      - +hostname
      - "{{ settings.hostname }}"
      - +sv_password
      - "{{ settings.password }}"
      - +sv_setsteamaccount
      - "{{ settings.gslt }}"
    env:
      # La bibliothèque Steam est cherchée dans ~/.steam/sdk64 (HOME est sur le volume).
      HOME: /data/home
      # Bibliothèques du moteur (`libv8.so`…), ajoutées par le lanceur officiel `cs2.sh` : sans
      # elles, `libserver.so` ne se charge pas.
      LD_LIBRARY_PATH: /data/server/game/bin/linuxsteamrt64
    ports:
      # CS2 annonce son port à Steam : allouer sur l'hôte le même numéro.
      game: { container: 27015, protocol: udp, public: true }
    volumes:
      data: { path: /data }
    writable: [/tmp]
    user: "1000:1000"

install:
  service: server
  steps:
    - steamcmd: { app: 730, dir: /data/server, validate: true }
    - script:
        run: mkdir -p /data/home/.steam/sdk64 && cp -f /opt/steamcmd/linux64/steamclient.so /data/home/.steam/sdk64/

settings:
  general:
    server:
      icon: server
      fields:
        hostname: { type: string, default: "Kuro CS2", max_length: 64, pattern: '^[^"\\]*$', required: true, restart: true }
        max_players: { type: int, default: 10, min: 2, max: 64, restart: true }
        password: { type: password, max_length: 64, pattern: '^[^"\s\\]*$', restart: true }
    match:
      icon: globe
      fields:
        game_alias: { type: enum, options: [competitive, casual, wingman, deathmatch], default: competitive, restart: true }
        map: { type: string, default: de_dust2, pattern: "^[a-z0-9_]{1,64}$", restart: true }
  advanced:
    steam:
      icon: shield
      fields:
        gslt: { type: password, max_length: 64, pattern: "^[A-Fa-f0-9]{0,64}$", restart: true }

files:
  server-cfg:
    service: server
    path: /data/server/game/csgo/cfg/server.cfg
    format: cfg
    mode: user

backup:
  ignore:
    server: [/data/server/game/bin/**, /data/server/game/core/**, /data/server/game/csgo/maps/**, /data/server/steamapps/**, /data/home/**]

lifecycle:
  service: server
  # Après la carte et la connexion à Steam et au GC (essayé sans GSLT, en 5 s environ).
  ready: { console: 'activated session on GC' }
  stop: { console: quit }
  timeout: 120
