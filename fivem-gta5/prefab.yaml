# yaml-language-server: $schema=https://raw.githubusercontent.com/kuroctl/kuro/main/shared/prefab/schema/prefab.v1.schema.json
# FiveM (GTA V multijoueur, Cfx.re) : serveur Linux `FXServer`, livré avec sa propre bibliothèque
# musl (`alpine/`). Installé par Kuro sans script : build épinglé (sha256) puis extraction du
# `.tar.xz` ; les ressources de base (`cfx-server-data`) viennent d'un commit fixé.
# Image d'exécution : `runtime-base` de Kuro (Debian 13, utilisateur 1000, tini ; ADR-0048) ; le
# serveur n'a besoin que de sa propre musl. Le nom du serveur passe par `kuro.cfg`, regénéré à
# chaque démarrage.
schema: kuro.prefab/v1
id: fivem
version: 0.3.0
category: game
tags: [fivem, gta-v, redm, roleplay]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
  resources:
    memory_mb: { min: 2048, recommended: 4096 }
    disk_mb: { min: 2048, recommended: 10240 }
assets:
  icon: assets/icon.png
  cover: assets/banner.webp
  thumbnail: assets/thumbnail.webp
x-status: "draft: not yet tried on a real node with a Cfx.re licence and the Kuro runtime image"
# Jeu sur le magasin Steam : le Studio en importe les images (ADR-0039).
steam: { app: 271590 }

services:
  server:
    image: ghcr.io/kuroctl/runtime-base@sha256:1603e0655f391242bd29d081b4906aacdf5489c52da7ab18e4baee368fd73a17
    # FXServer lancé par sa propre musl, depuis le dossier du serveur ; les valeurs restent des
    # arguments séparés ("$@"). Sans txAdmin, le serveur charge `server.cfg` ; avec, txAdmin le
    # gère (port 40120).
    command:
      - sh
      - -c
      - >-
        cd /home/container && d=$PWD/alpine &&
        if [ "$TXADMIN_ENABLE" != "1" ]; then set -- "$@" +exec server.cfg; fi &&
        exec "$d/opt/cfx-server/ld-musl-x86_64.so.1" --library-path "$d/usr/lib/v8/:$d/lib/:$d/usr/lib/"
        -- "$d/opt/cfx-server/FXServer" +set citizen_dir "$d/opt/cfx-server/citizen/" "$@"
      - fxserver
      - +set
      - sv_licenseKey
      - "{{ settings.license }}"
      - +set
      - steam_webApiKey
      - '{{ settings.steam_web_api_key | default("none") }}'
      - +set
      - sv_maxplayers
      - "{{ settings.max_players }}"
    env:
      # FXServer et txAdmin écrivent sous HOME : sur le volume, la racine étant en lecture seule.
      HOME: /home/container
      TXADMIN_ENABLE: "{{ settings.txadmin }}"
      TXHOST_TXA_PORT: "{{ ports.txadmin.container }}"
      TXHOST_DATA_PATH: /home/container/txData
    ports:
      # Le jeu écoute en TCP et en UDP sur le même numéro.
      game: { container: 30120, protocol: tcp+udp, public: true }
      # Console web de txAdmin, quand elle est activée.
      txadmin: { container: 40120, protocol: tcp, public: true }
    volumes:
      data: { path: /home/container }
    writable: [/tmp]
    user: "1000:1000"

install:
  service: server
  # Image d'installation de Kuro : `git` y est, lancé sans root.
  image: ghcr.io/kuroctl/installer@sha256:7d63607e2b791c40daf6e3a8da12649e666920d5c4b7f9dc941b95e2187e2b5d
  steps:
    # Build « recommended » 35245 ; une version plus récente = une nouvelle version du prefab.
    - download:
        url: https://runtime.fivem.net/artifacts/fivem/build_proot_linux/master/35245-6efb47dff473c0e2a12fb50b08d74c0eb24a50d5/fx.tar.xz
        sha256: 16fcffd53a30a3909cbb2cfd26f89f950a59452792cafd0eda2174bdfeef9b2f
        to: /home/container/fx.tar.xz
    - extract:
        from: /home/container/fx.tar.xz
        to: /home/container
        executable: [alpine/opt/cfx-server/FXServer, alpine/opt/cfx-server/ld-musl-x86_64.so.1]
    - remove: { path: /home/container/fx.tar.xz }
    # Ressources de base (chat, spawnmanager, mapmanager…), au commit fixé : git vérifie le contenu.
    - script:
        run: |
          set -eu
          rm -rf /tmp/cfx-server-data
          git init -q /tmp/cfx-server-data
          cd /tmp/cfx-server-data
          git fetch -q --depth 1 https://github.com/citizenfx/cfx-server-data.git c6afa3909c763e3327ed76825e78453286c99f05
          git checkout -q FETCH_HEAD
          mkdir -p /home/container/resources
          cp -R resources/. /home/container/resources/
          rm -rf /tmp/cfx-server-data

settings:
  general:
    server:
      icon: server
      fields:
        license: { type: password, required: true, pattern: '^[A-Za-z0-9_-]{1,64}$', restart: true, visibility: customer }
        # Écrit entre guillemets dans kuro.cfg : ni guillemet ni barre oblique inverse.
        server_name: { type: string, default: "Kuro FiveM", pattern: '^[^"\\]{1,80}$', required: true, restart: true, visibility: customer }
        max_players: { type: int, default: 48, min: 1, max: 48, restart: true }
        game: { type: enum, options: [gta5], default: gta5, restart: true }
  advanced:
    administration:
      icon: shield
      fields:
        txadmin: { type: enum, options: ["0", "1"], default: "0", restart: true, visibility: customer }
        steam_web_api_key: { type: password, pattern: '^[A-Za-z0-9]{0,64}$', restart: true, visibility: customer }

files:
  # Réglages de Kuro, regénérés à chaque démarrage depuis le panel.
  kuro-cfg:
    service: server
    path: /home/container/kuro.cfg
    format: cfg
    mode: template
    template: templates/kuro.cfg
  # Configuration libre (ressources, permissions) ; elle charge kuro.cfg.
  server-cfg:
    service: server
    path: /home/container/server.cfg
    format: cfg
    mode: user
    template: templates/server.cfg

backup:
  ignore:
    server: [/home/container/alpine/**, /home/container/cache/**]

lifecycle:
  service: server
  ready: { console: 'succeeded\. Welcome!' }
  stop: { console: quit }
  timeout: 60
