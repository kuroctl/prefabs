# yaml-language-server: $schema=https://raw.githubusercontent.com/kuroctl/kuro/main/shared/prefab/schema/prefab.v1.schema.json
# Rust (Facepunch) : serveur dédié Linux (app Steam 258550), installé par SteamCMD. Image
# d'exécution : `runtime-steamcmd` de Kuro (Debian 13, utilisateur 1000, tini ; ADR-0048).
# La console Linux de Rust n'est pas interactive : les commandes passent par WebRCON (port `rcon`,
# interne au réseau du serveur). Les mises à jour forcées (premier jeudi du mois) demandent une
# réinstallation, sans quoi les clients à jour ne peuvent plus se connecter.
schema: kuro.prefab/v1
id: rust
version: 1.3.0
category: game
tags: [rust, survival, steam]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
  # Ressources du serveur entier (ADR-0031) : minimum bloquant, valeur recommandée pré-remplie.
  resources:
    memory_mb: { min: 8192, recommended: 12288 }
    cpu_percent: { min: 200, recommended: 400 }
    disk_mb: { min: 20480, recommended: 30720 }
assets:
  icon: assets/icon.png
  cover: assets/banner.webp
  thumbnail: assets/thumbnail.webp
# Jeu sur le magasin Steam : le Studio en importe les images (ADR-0039).
steam: { app: 252490 }

services:
  server:
    image: ghcr.io/kuroctl/runtime-steamcmd@sha256:5cf1e3a9fa0eeb1579b0a2c1aad0f6dfd28d91291f98e0729c31e600fbe0fe0f
    # templates/start.sh se place dans /data/server (Rust y résout server/<identité>) et lance le
    # serveur avec ces arguments, séparés ("$@"), jamais collés dans le script ; à l'arrêt, il
    # envoie `quit` par WebRCON pour enregistrer le monde.
    command:
      - bash
      - /data/kuro-start.sh
      - -batchmode
      - -nographics
      - -logfile
      - /dev/stdout
      - +server.identity
      - kuro
      - +server.ip
      - 0.0.0.0
      - +server.port
      - "{{ ports.game.container }}"
      - +server.queryport
      - "{{ ports.query.container }}"
      - +server.level
      - Procedural Map
      - +server.worldsize
      - "{{ settings.world_size }}"
      - +server.seed
      - "{{ settings.seed }}"
      - +server.maxplayers
      - "{{ settings.max_players }}"
      - +server.hostname
      - "{{ settings.hostname }}"
      - +server.description
      - "{{ settings.description }}"
      - +server.url
      - "{{ settings.url }}"
      - +server.headerimage
      - "{{ settings.header_image }}"
      - +server.saveinterval
      - "{{ settings.save_interval }}"
      - +rcon.web
      - "1"
      - +rcon.port
      - "{{ ports.rcon.container }}"
      - +rcon.password
      - "{{ settings.rcon_password }}"
      - +app.port
      - "{{ ports.app.container }}"
    env:
      HOME: /data/home
      LD_LIBRARY_PATH: /data/server:/data/server/RustDedicated_Data/Plugins/x86_64
      # Lus par templates/start.sh pour envoyer `quit` à l'arrêt.
      RCON_PORT: "{{ ports.rcon.container }}"
      RCON_PASSWORD: "{{ settings.rcon_password }}"
    ports:
      # Rust annonce ses ports à Steam : allouer sur l'hôte les mêmes numéros.
      game: { container: 28015, protocol: udp, public: true }
      query: { container: 28017, protocol: udp, public: true }
      # Rust+ (application compagnon).
      app: { container: 28082, protocol: tcp, public: true }
      # WebRCON : jamais publié.
      rcon: { container: 28016 }
    volumes:
      data: { path: /data }
    writable: [/tmp]
    user: "1000:1000"

install:
  service: server
  steps:
    - steamcmd: { app: 258550, dir: /data/server, validate: true }
    # La bibliothèque Steam du serveur est cherchée dans ~/.steam/sdk64 (HOME est sur le volume).
    - script:
        run: mkdir -p /data/home/.steam/sdk64 && cp -f /opt/steamcmd/linux64/steamclient.so /data/home/.steam/sdk64/
    - copy: { template: templates/start.sh, to: /data/kuro-start.sh }

settings:
  general:
    server:
      icon: server
      fields:
        hostname: { type: string, default: "Kuro Rust", max_length: 64, required: true, restart: true, visibility: customer }
        description: { type: text, max_length: 512, restart: true, visibility: customer }
        url: { type: string, max_length: 256, pattern: "^(https://\\S+)?$", restart: true, visibility: customer }
        header_image: { type: string, max_length: 256, pattern: "^(https://\\S+\\.(png|jpe?g))?$", restart: true, visibility: customer }
        max_players: { type: int, default: 50, min: 1, max: 500, restart: true }
    world:
      icon: globe
      fields:
        world_size: { type: slider, default: 3000, min: 1000, max: 6000, step: 250, editable: deploy, restart: true, visibility: customer }
        seed: { type: int, default: 12345, min: 0, max: 2147483647, editable: deploy, restart: true, visibility: customer }
  advanced:
    saves:
      icon: archive
      fields:
        save_interval: { type: int, default: 300, min: 60, max: 3600, restart: true, visibility: customer }
    security:
      icon: shield
      fields:
        # Placé dans l'adresse WebRCON par templates/start.sh : lettres, chiffres, `_` et `-`.
        rcon_password: { type: secret, generate: { length: 32 }, pattern: '^[A-Za-z0-9_-]{8,128}$' }

files:
  server-cfg:
    service: server
    path: /data/server/server/kuro/cfg/server.cfg
    format: cfg
    mode: user
  users-cfg:
    service: server
    path: /data/server/server/kuro/cfg/users.cfg
    format: cfg
    mode: user

backup:
  ignore:
    server: [/data/server/RustDedicated_Data/**, /data/server/steamapps/**, /data/home/**]

lifecycle:
  service: server
  ready: { console: 'Server startup complete' }
  # Intercepté par templates/start.sh, qui envoie `quit` par WebRCON (enregistrement du monde).
  stop: { signal: SIGINT }
  timeout: 300
