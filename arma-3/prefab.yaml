# yaml-language-server: $schema=https://raw.githubusercontent.com/kuroctl/kuro/main/shared/prefab/schema/prefab.v1.schema.json
# Arma 3 : serveur dédié Linux (app Steam 233780). SteamCMD refuse de le télécharger en anonyme :
# l'installation se connecte avec le compte Steam de l'installation, réglé dans le panel
# (ADR-0033). Ce compte n'a pas besoin de posséder le jeu.
# Image d'exécution : `runtime-steamcmd` de Kuro (Debian 13, utilisateur 1000, tini ; ADR-0048).
# Kuro met le serveur à jour en réinstallant (le compte Steam ne sert qu'à l'installation).
schema: kuro.prefab/v1
id: arma-3
version: 0.3.0
category: game
tags: [arma-3, military, simulation, steam]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
  # Ressources du serveur entier (ADR-0031) ; les mods font vite grossir le disque.
  resources:
    memory_mb: { min: 2048, recommended: 3072 }
    disk_mb: { min: 10240, recommended: 51200 }
assets:
  icon: assets/icon.png
  cover: assets/banner.webp
  thumbnail: assets/thumbnail.webp
x-status: "draft: not yet tried on a real node with a Steam account and the Kuro runtime image"
# Jeu sur le magasin Steam : le Studio en importe les images (ADR-0039).
steam: { app: 107410 }

services:
  server:
    image: ghcr.io/kuroctl/runtime-steamcmd@sha256:5cf1e3a9fa0eeb1579b0a2c1aad0f6dfd28d91291f98e0729c31e600fbe0fe0f
    # Le shell ne fait que se placer dans le dossier du serveur ; les valeurs restent des arguments
    # séparés ("$@"), jamais collés dans le script. `-noLogs` : le journal va à la console.
    command:
      - sh
      - -c
      - 'cd /home/container && exec ./arma3server_x64 "$@"'
      - arma3
      - -ip=0.0.0.0
      - "-port={{ ports.game.container }}"
      - -profiles=./serverprofile
      - -bepath=./
      - -cfg=basic.cfg
      - -config=server.cfg
      - -noLogs
    env:
      # Le serveur écrit sous HOME : sur le volume, la racine étant en lecture seule.
      HOME: /home/container
    ports:
      # Ports dérivés du port du jeu : +1 (requête Steam), +2 (Steam), +4 (BattlEye). Réserver une
      # plage consécutive.
      game: { container: 2302, protocol: udp, public: true }
      query: { container: 2303, protocol: udp, public: true }
      steam: { container: 2304, protocol: udp, public: true }
      battleye: { container: 2306, protocol: udp, public: true }
    volumes:
      data: { path: /home/container }
    writable: [/tmp]
    user: "1000:1000"

install:
  service: server
  steps:
    - steamcmd: { app: 233780, dir: /home/container, validate: true, login: account }

settings:
  general:
    server:
      icon: server
      fields:
        # Écrits entre guillemets dans server.cfg : ni guillemet ni barre oblique inverse.
        server_name: { type: string, default: "Kuro Arma 3", pattern: '^[^"\\]{1,80}$', required: true, restart: true, visibility: customer }
        password: { type: password, pattern: '^[^"\\]{0,64}$', restart: true, visibility: customer }
        max_players: { type: int, default: 32, min: 1, max: 256, restart: true }
    administration:
      icon: shield
      fields:
        admin_password: { type: secret, generate: { length: 24 } }
        battleye: { type: enum, options: ["1", "0"], default: "1", restart: true }

files:
  server-cfg:
    service: server
    path: /home/container/server.cfg
    format: cfg
    mode: template
    template: templates/server.cfg
  basic-cfg:
    service: server
    path: /home/container/basic.cfg
    format: cfg
    mode: user
    template: templates/basic.cfg

backup:
  ignore:
    server: [/home/container/steamapps/**, /home/container/addons/**, /home/container/dta/**]

lifecycle:
  service: server
  ready: { console: 'Host identity created.' }
  # SIGINT : arrêt propre du serveur.
  stop: { signal: SIGINT }
  timeout: 60
