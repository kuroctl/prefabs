# yaml-language-server: $schema=https://raw.githubusercontent.com/kuroctl/kuro/main/shared/prefab/schema/prefab.v1.schema.json
# Valheim : serveur dédié Linux (app Steam 896660), installé par SteamCMD.
# Image d'exécution : `runtime-steamcmd` de Kuro (Debian 13, utilisateur 1000, tini ; ADR-0048).
# Les réglages arrivent en arguments séparés, jamais collés dans une ligne de commande (ADR-0027).
schema: kuro.prefab/v1
id: valheim
version: 1.3.0
category: game
tags: [valheim, survival, steam]
authors:
  - name: Kuro
requires:
  kuro: ">=0.2"
  # Ressources du serveur entier (ADR-0031) : minimum bloquant, valeur recommandée pré-remplie.
  resources:
    memory_mb: { min: 4096, recommended: 4096 }
    disk_mb: { min: 3072, recommended: 10240 }
assets:
  icon: assets/icon.png
  cover: assets/banner.webp
  thumbnail: assets/thumbnail.webp
x-status: "draft: not yet tried on a real node with the Kuro runtime image (audio libraries, ready line)"
# Jeu sur le magasin Steam : le Studio en importe les images (ADR-0039).
steam: { app: 892970 }

services:
  server:
    image: ghcr.io/kuroctl/runtime-steamcmd@sha256:5cf1e3a9fa0eeb1579b0a2c1aad0f6dfd28d91291f98e0729c31e600fbe0fe0f
    # Le shell ne fait que se placer dans le dossier du serveur ; les valeurs restent des arguments
    # séparés ("$@"), jamais collés dans le script.
    command:
      - sh
      - -c
      - 'cd /home/container && exec ./valheim_server.x86_64 "$@"'
      - valheim
      - -nographics
      - -batchmode
      - -name
      - "{{ settings.server_name }}"
      - -port
      - "{{ ports.game.container }}"
      - -world
      - "{{ settings.world_name }}"
      - -password
      - "{{ settings.password }}"
      - -public
      - "{{ settings.public }}"
      - -preset
      - "{{ settings.preset }}"
      - -saveinterval
      - "{{ settings.save_interval }}"
      - -backups
      - "{{ settings.backups }}"
      - -savedir
      - /home/container/saves
    env:
      # Unity écrit sous HOME : sur le volume, la racine étant en lecture seule.
      HOME: /home/container
      LD_LIBRARY_PATH: /home/container/linux64
      # Identifiant du jeu (et non du serveur) attendu par la bibliothèque Steam.
      SteamAppId: "892970"
    ports:
      # Le port de requête est toujours celui du jeu + 1 : réserver deux ports consécutifs.
      game: { container: 2456, protocol: udp, public: true }
      query: { container: 2457, protocol: udp, public: true }
    volumes:
      data: { path: /home/container }
    writable: [/tmp]
    user: "1000:1000"

install:
  service: server
  steps:
    - steamcmd: { app: 896660, dir: /home/container, validate: true }

settings:
  general:
    server:
      icon: server
      fields:
        server_name: { type: string, default: "Kuro Valheim", max_length: 60, required: true, restart: true, visibility: customer }
        password:
          type: password
          required: true
          # 5 caractères au moins ; le serveur refuse aussi un mot de passe contenu dans le nom
          # du serveur ou du monde.
          pattern: "^.{5,64}$"
          restart: true
          visibility: customer
        public: { type: enum, options: ["1", "0"], default: "1", restart: true, visibility: customer }
    world:
      icon: globe
      fields:
        world_name: { type: string, default: Dedicated, pattern: "^[A-Za-z0-9_-]{1,20}$", restart: true, visibility: customer }
        preset: { type: enum, options: [normal, casual, easy, hard, hardcore, immersive, hammer], default: normal, restart: true, visibility: customer }
  advanced:
    saves:
      icon: archive
      fields:
        save_interval: { type: int, default: 1800, min: 60, max: 7200, restart: true, visibility: customer }
        backups: { type: int, default: 4, min: 1, max: 20, restart: true, visibility: customer }

files:
  adminlist:
    service: server
    path: /home/container/saves/adminlist.txt
    format: text
    mode: user
  bannedlist:
    service: server
    path: /home/container/saves/bannedlist.txt
    format: text
    mode: user
  permittedlist:
    service: server
    path: /home/container/saves/permittedlist.txt
    format: text
    mode: user

backup:
  ignore:
    server: [/home/container/valheim_server_Data/**, /home/container/linux64/**, /home/container/steamapps/**]

lifecycle:
  service: server
  ready: { console: 'Game server connected' }
  # Pas de console interactive : SIGINT enregistre le monde puis arrête le serveur.
  stop: { signal: SIGINT }
  timeout: 120
