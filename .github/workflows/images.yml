# Images d'exécution et d'installation de Kuro (ADR-0048) : `runtime-base`, `installer`,
# `runtime-steamcmd` et une `runtime-proton-<nom>` par ligne de `images/runtime-proton/versions`,
# publiées dans ghcr.io/kuroctl/.
#
# Chaque image est analysée par Trivy avant publication (faille critique ou haute avec un correctif
# disponible : rien n'est publié), puis publiée avec une attestation de provenance
# (`.github/actions/kuro-image`). Une image dérivée part de la précédente par son digest, jamais
# par un tag. Reconstruction chaque semaine pour les correctifs de Debian. Tag :
# `<majeure>-<date>-<numéro du run>`, jamais `latest` ; les digests sont dans le résumé du run.
#
# Un paquet GHCR nouveau est privé : le rendre public une fois (comme ceux du miroir).
name: images

on:
  push:
    branches: [main]
    paths: [images/**, .github/workflows/images.yml, .github/actions/kuro-image/**]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: images
  cancel-in-progress: false

env:
  # Version majeure du contrat des images (ADR-0048) : la changer = nouvelle majeure.
  MAJOR: "1"

jobs:
  base:
    name: runtime-base et installer
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      base: ${{ steps.base.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/setup-trivy@v0.3.1
      - id: tag
        run: echo "tag=${MAJOR}-$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - id: base
        uses: ./.github/actions/kuro-image
        with:
          name: runtime-base
          context: images/runtime-base
          platforms: linux/amd64,linux/arm64
          tag: ${{ steps.tag.outputs.tag }}
      - uses: ./.github/actions/kuro-image
        with:
          name: installer
          context: images/installer
          platforms: linux/amd64,linux/arm64
          tag: ${{ steps.tag.outputs.tag }}
          build-args: BASE=${{ steps.base.outputs.ref }}

  steamcmd:
    name: runtime-steamcmd
    needs: base
    runs-on: ubuntu-24.04
    outputs:
      steamcmd: ${{ steps.steamcmd.outputs.ref }}
      proton: ${{ steps.proton.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/setup-trivy@v0.3.1
      - id: steamcmd
        uses: ./.github/actions/kuro-image
        with:
          name: runtime-steamcmd
          context: images/runtime-steamcmd
          tag: ${{ needs.base.outputs.tag }}
          build-args: BASE=${{ needs.base.outputs.base }}
      # Versions de Proton GE : `<nom> <tag>` par ligne ; l'archive de la release s'appelle
      # `<tag>-x86_64.tar.gz` depuis GE-Proton 11, `<tag>.tar.gz` avant.
      - id: proton
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          entries=()
          while read -r name tag; do
            case "$name" in ''|\#*) continue ;; esac
            assets=$(gh api "repos/GloriousEggroll/proton-ge-custom/releases/tags/$tag" --jq '.assets[].name')
            if grep -qx "$tag-x86_64.tar.gz" <<< "$assets"; then asset="$tag-x86_64"
            elif grep -qx "$tag.tar.gz" <<< "$assets"; then asset="$tag"
            else echo "no x86_64 archive in release $tag" >&2; exit 1
            fi
            entries+=("$(jq -cn --arg name "$name" --arg tag "$tag" --arg asset "$asset" '$ARGS.named')")
          done < images/runtime-proton/versions
          echo "matrix=$(printf '%s\n' "${entries[@]}" | jq -cs .)" >> "$GITHUB_OUTPUT"

  proton:
    name: runtime-proton-${{ matrix.proton.name }}
    needs: [base, steamcmd]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        proton: ${{ fromJSON(needs.steamcmd.outputs.proton) }}
    steps:
      - uses: actions/checkout@v7
      # Proton occupe plusieurs Go : place libérée sur le runner.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/setup-trivy@v0.3.1
      - uses: ./.github/actions/kuro-image
        with:
          name: runtime-proton-${{ matrix.proton.name }}
          context: images/runtime-proton
          tag: ${{ needs.base.outputs.tag }}
          build-args: |
            BASE=${{ needs.steamcmd.outputs.steamcmd }}
            GE_PROTON_TAG=${{ matrix.proton.tag }}
            GE_PROTON_ASSET=${{ matrix.proton.asset }}
