# Chaque prefab est chargé et validé exactement comme l'import de Kuro (crate `kuro-prefab`, binaire
# `kuro-prefab-check`) : manifest, traductions, gabarits, images ; deux dossiers au même
# `id@version` sont refusés.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Prefabs valides pour Kuro
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: prefabs
      # Validation de la branche principale de Kuro : le format qu'elle accepte.
      - uses: actions/checkout@v7
        with:
          repository: kuroctl/kuro
          path: kuro
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kuro
      - run: cargo run --locked --manifest-path kuro/Cargo.toml -p kuro-prefab --bin kuro-prefab-check -- prefabs
      # Une image du miroir citée par un manifest doit être listée dans `images/mirror.txt` (ADR-0048).
      - name: Images du miroir listées
        working-directory: prefabs
        run: |
          set -eu
          missing=0
          for image in $(grep -rhoE 'ghcr\.io/kuroctl/mirror/[^[:space:]"]+' --include=prefab.yaml . | sort -u); do
            source_path="${image#ghcr.io/kuroctl/mirror/}"
            if ! grep -qE "^[^#[:space:]]+/${source_path//./\\.}\$" images/mirror.txt; then
              echo "not in images/mirror.txt: $image" >&2
              missing=1
            fi
          done
          exit "$missing"
